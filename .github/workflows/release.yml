# Builds the Android app and publishes a GitHub Release when a version tag
# is pushed:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# The release text comes from .github/release-notes/<tag>.md.
#
# Signing: add these repository secrets to sign with your own key, so each
# release installs as an update over the last one. Without them the APKs
# use a throwaway debug key.
#   ANDROID_KEYSTORE_BASE64  base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set; the APKs use a debug key and can't update a differently signed install."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APKs
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Waterly-$version.apk"
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/Waterly-$version-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/Waterly-$version-arm32.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/Waterly-$version-x86_64.apk"
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          name: Waterly ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: dist/*.apk
